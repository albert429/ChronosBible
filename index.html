<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ef" />
    <meta
      name="description"
      content="الكتاب المقدس: قراءة واستماع، بالترتيب المعتاد أو الزمني."
    />
    <script>
      try {
        if (localStorage.getItem("word-dark") === "true") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content =
            "#181e1a";
        }
      } catch {}
    </script>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/src/assets/favicon.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/src/assets/favicon.svg"
    />
    <link
      rel="preload"
      href="/src/assets/amiri.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/noto-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>الكتاب المقدس</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >يحتاج قارئ الكتاب المقدس إلى تفعيل JavaScript في المتصفح.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
