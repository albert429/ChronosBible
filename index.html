<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ef" />
    <meta
      name="description"
      content="الكتاب المقدس: قراءة واستماع، بالترتيب المعتاد أو الزمني."
    />
    <script>
      // The saved theme before first paint (see src/navigation/appearance.ts).
      try {
        var theme =
          localStorage.getItem("word-theme") ||
          (localStorage.getItem("word-dark") === "true" ? "dark" : "auto");
        if (
          theme === "dark" ||
          (theme === "auto" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content =
            "#181e1a";
        }
      } catch {}
    </script>
    <script>
      // Fetch the reading the app will open alongside its code, not after it
      // (see src/reader/preload.ts); a wrong guess costs one small request.
      try {
        (function (versions) {
          var query = new URLSearchParams(location.search);
          var mode = query.get("mode");
          var paths;
          if (mode === "bible")
            paths = [
              "/bible/" +
                query.get("book") +
                "/" +
                query.get("chapter") +
                ".json",
            ];
          else if (mode === "chronological")
            paths = [
              "/chronology/" + query.get("testament") + ".json",
              "/chronology/" +
                query.get("testament") +
                "/" +
                query.get("reading") +
                ".json",
            ];
          else if (mode) paths = [];
          else if (query.has("day"))
            paths = ["/readings/" + query.get("day") + ".json"];
          else {
            var saved = localStorage.getItem("bible-reader-preload-v1");
            // A fresh reader opens Genesis 1; an older one, their own place.
            paths = saved
              ? JSON.parse(saved)
              : localStorage.getItem("bible-reader-state-v2") ||
                  localStorage.getItem("bible-reader-location-v1") ||
                  localStorage.getItem("nt-reading-progress-v1")
                ? []
                : ["/bible/GEN/1.json"];
          }
          paths.forEach(function (path) {
            if (
              !/^\/(bible|readings|chronology)\/[\w-]+(\/[\w-]+)?\.json$/.test(
                path,
              )
            )
              return;
            var version = versions[path.split("/")[1]];
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "fetch";
            link.crossOrigin = "anonymous";
            link.href = version ? path + "?v=" + version : path;
            document.head.appendChild(link);
          });
        })(__DATA_VERSIONS_JSON__);
      } catch {}
    </script>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/src/assets/favicon.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/src/assets/favicon.svg"
    />
    <link
      rel="preload"
      href="/src/assets/amiri.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/noto-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>الكتاب المقدس</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >يحتاج قارئ الكتاب المقدس إلى تفعيل JavaScript في المتصفح.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
