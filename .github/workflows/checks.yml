name: Reading app checks
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      AUDIO_TEST_FIXTURES: "1"
      VITE_AUDIO_BASE_URL: https://audio.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run agents -- check
      - run: npm run validate
      - run: python3 -I -m unittest discover -s scripts/tests
      - run: python3 -m py_compile scripts/*.py
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: test-results/
